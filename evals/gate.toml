# The eval gate (`make evals`; ADR 0014). min_cases must equal the number of committed
# cases in cases/ (tests/runners/test_runner_gate.py), so deleting a case alone fails.
# Deleting a case and lowering min_cases together passes the tests: the ask on this file
# and the review are the control for that.
min_cases = 14
# Recorded samples per case, at the current prompt version.
samples = 3
# The share of samples that must pass every scorer of their case. Pre-registered before
# the first live run (M1 PR 16): a lower bar is a reviewed edit with its reason in
# evals/results/. A hard scorer (no_foreign_record) fails the gate at any rate.
min_pass_rate = 0.8
