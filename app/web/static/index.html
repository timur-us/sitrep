<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<link rel="stylesheet" href="/static/app.css">
<script src="/static/app.js" defer></script>
</head>
<body>
<main>
<header>
<h1>{{title}}</h1>
<p class="tagline">{{tagline}}</p>
</header>

<form id="ask">
<label for="question">Your question</label>
<textarea id="question" rows="4" maxlength="2000" spellcheck="false" autocomplete="off"></textarea>
<button type="submit">Ask</button>
</form>

<p id="status" role="status" aria-live="polite"></p>

<section id="result" hidden>
<h2>Answer</h2>
<p id="stop" class="stop" hidden></p>
<div class="output">
<p id="answer-label" class="output-label">Model output. It can quote e-mails and documents word for word; nothing in it is a link.</p>
<div id="answer" class="answer"></div>
</div>

<h2>Sources</h2>
<ol id="citations" class="citations"></ol>

<h2>Grounding</h2>
<p id="figures"></p>
<p id="unknown"></p>
<p id="grounding-note" class="note">Found in the sources means the figure appears in a document this answer retrieved, not that it is correct.</p>

<dl class="facts">
<dt>Trace id</dt><dd id="trace"></dd>
<dt>Cost</dt><dd id="cost"></dd>
<dt>Tokens</dt><dd id="tokens"></dd>
</dl>
</section>
</main>
</body>
</html>
