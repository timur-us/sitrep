# Version updates, weekly and grouped, for nothing younger than 7 days (ADR 0006;
# security updates are not delayed). tests/ci/test_workflow.py pins this file.
# The uv pin lives in two places (setup-uv's version in ci.yml, the uv image in the
# Dockerfile): a Dependabot bump of one of them fails the test that keeps them equal,
# by design. The pin is bumped by hand.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      uv:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      docker:
        patterns: ["*"]
